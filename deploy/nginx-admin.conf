# The owner's panel: admin/server.js, a Node service bound to 127.0.0.1:8787.
# Included from the pookie vhost by deploy.sh, which inserts the include line
# once and otherwise leaves certbot's file alone. Only reachable through this
# server block, so only over TLS and only for this hostname.
location /admin/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 180s;        # a publish builds and audits the site
    client_max_body_size 4m;        # one photograph size at a time
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # An add_header in a location replaces the server block's, so the site's
    # own headers are repeated here — with framing refused outright, since
    # nothing ever legitimately frames the panel.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
