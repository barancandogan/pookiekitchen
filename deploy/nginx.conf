# ------------------------------------------------------------------
# nginx vhost for pookie.nileapps.co.uk
#
# Install as /etc/nginx/sites-available/pookie and symlink into
# sites-enabled. See README.md under "Deployment".
#
# HTTP ONLY, deliberately. certbot's nginx plugin rewrites this block
# in place — it adds `listen 443 ssl`, the certificate paths and the
# SSL includes here, and writes a separate port-80 server that 301s to
# https. Every directive below therefore ends up in the HTTPS block
# without being written twice.
#
# Do NOT pre-write a `listen 443 ssl` block: nginx refuses to start a
# TLS listener with no ssl_certificate, so `nginx -t` fails before
# certbot ever gets a chance to issue one.
#
# NOTE: this server also hosts other sites. There is no `default_server`
# on either listen line, so this vhost answers for its own name only and
# cannot capture traffic meant for anything else on the box.
#
# Kept in the repository so the server is reproducible: if the VPS is
# rebuilt, this file plus deploy.sh is the whole story.
# ------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name pookie.nileapps.co.uk;

    root /var/www/pookie;
    index index.html;

    charset utf-8;

    # /menu/ -> /menu/index.html, and anything unknown gets the real 404
    # page rather than nginx's default.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Hashless filenames, so HTML must never be cached by an intermediary —
    # a stale menu is worse than a slow one. The build rewrites every page on
    # every deploy, and the pages are 3–4 kB gzipped.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Photographs and the logo carry their dimensions in the filename
    # (<slug>-400.webp), so a changed image is a changed URL and these are
    # safe to cache hard.
    location /assets/img/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # CSS and JS have no content hash yet, so a week with revalidation.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # robots.txt currently disallows everything — this is a staging host.
    # See site.indexable in src/data.js.
    location = /robots.txt {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;
    # WebP and JPEG are already compressed; gzipping them wastes CPU.

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # The site loads no third-party anything: no webfont host, no analytics,
    # no embeds. The policy can therefore be this tight.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    access_log /var/log/nginx/pookie.access.log;
    error_log  /var/log/nginx/pookie.error.log;
}
