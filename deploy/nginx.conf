# ------------------------------------------------------------------
# nginx vhost for pookie.nileapps.co.uk
#
# Install as /etc/nginx/sites-available/pookie and symlink into
# sites-enabled. certbot rewrites this file when it issues the
# certificate, so run certbot AFTER copying it — see README.md
# under "Deployment".
#
# It is kept in the repository so the server is reproducible: if the
# VPS is ever rebuilt, this file plus deploy.sh is the whole story.
# ------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name pookie.nileapps.co.uk;

    # certbot replaces this block with a 301 to https once the
    # certificate exists. Until then it serves the challenge.
    root /var/www/pookie;
    index index.html;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pookie.nileapps.co.uk;

    root /var/www/pookie;
    index index.html;

    # ssl_certificate / ssl_certificate_key are filled in by certbot.

    charset utf-8;

    # /menu/ -> /menu/index.html, and anything unknown gets the real 404
    # page rather than nginx's default.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Hashless filenames, so HTML must never be cached by an intermediary —
    # a stale menu is worse than a slow one. The build rewrites every page on
    # every deploy, and the pages are 3–4 kB gzipped.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Photographs and the logo carry their dimensions in the filename
    # (<slug>-400.webp), so a changed image is a changed URL and these are
    # safe to cache hard.
    location /assets/img/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # CSS and JS have no content hash yet, so a week with revalidation.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # robots.txt currently disallows everything — this is a staging host.
    # See site.indexable in src/data.js.
    location = /robots.txt {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;
    # WebP and JPEG are already compressed; gzipping them wastes CPU.

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # The site loads no third-party anything: no webfont host, no analytics,
    # no embeds. The policy can therefore be this tight.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    access_log /var/log/nginx/pookie.access.log;
    error_log  /var/log/nginx/pookie.error.log;
}
