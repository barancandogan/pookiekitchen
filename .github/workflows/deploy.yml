name: Deploy

# Every push to main builds the site and runs the audit — that part needs no
# secrets and is a plain CI check. When the server secrets are set (README →
# Deployment) the same audited build is shipped to the VPS; until then the
# deploy job is skipped and the run says so in a warning.
#
# The server needs no GitHub access under this scheme: the build happens here,
# only dist/ and deploy/ travel over SSH, and deploy/remote.sh does the rest.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: node build.js

      # The audit is the gate, not a report: it exits non-zero on a structural
      # or accessibility failure and on any launch-gate breach, and a failed
      # step here means nothing reaches the server.
      - name: Audit
        run: node audit.js

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3
          if-no-files-found: error

      - name: Are the server secrets set?
        id: gate
        # The host and user are not secrets, so a repository Variable does for
        # them too. The key or password must be a Secret. Every expected name is
        # reported as found/missing (never its value) so a skipped deploy says
        # exactly what to fix.
        env:
          HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST || '187.127.84.93' }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.PAWCAL_DEPLOY }}
          PASSWORD: ${{ secrets.VPS_PASSWORD }}
          S_PAWCAL: ${{ secrets.PAWCAL_DEPLOY != '' }}
          S_HOST: ${{ secrets.VPS_HOST != '' }}
          S_USER: ${{ secrets.VPS_USER != '' }}
          S_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
          S_PASSWORD: ${{ secrets.VPS_PASSWORD != '' }}
          S_HOST_KEY: ${{ secrets.VPS_HOST_KEY != '' }}
          V_HOST: ${{ vars.VPS_HOST != '' }}
          V_USER: ${{ vars.VPS_USER != '' }}
          V_KEY: ${{ vars.VPS_SSH_KEY != '' }}
          V_PASSWORD: ${{ vars.VPS_PASSWORD != '' }}
        run: |
          {
            echo "### Server settings seen by this run"
            echo ""
            echo "| Name | Secret | Variable |"
            echo "|---|---|---|"
            echo "| VPS_HOST | $S_HOST | $V_HOST |"
            echo "| VPS_USER | $S_USER | $V_USER |"
            echo "| VPS_SSH_KEY | $S_KEY | $V_KEY |"
            echo "| VPS_PASSWORD | $S_PASSWORD | $V_PASSWORD |"
            echo "| VPS_HOST_KEY | $S_HOST_KEY | - |"
            echo "| PAWCAL_DEPLOY (accepted as the key) | $S_PAWCAL | - |"
            echo ""
            echo "The host falls back to the address in README.md when neither a Secret"
            echo "nor a Variable sets it, so only a credential is strictly required."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$HOST" ] && { [ -n "$KEY" ] || [ -n "$PASSWORD" ]; }; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            missing=""
            [ -n "$HOST" ] || missing="$missing VPS_HOST"
            [ -n "$KEY" ] || [ -n "$PASSWORD" ] || missing="$missing a-credential(VPS_SSH_KEY,VPS_PASSWORD-or-PAWCAL_DEPLOY)"
            hint="Add it in THIS repository under Settings → Secrets and variables → Actions → Repository secrets."
            [ "$V_KEY" = true ] || [ "$V_PASSWORD" = true ] && hint="A key or password was added as a Variable; it must be a Secret. $hint"
            echo "::warning title=Deploy skipped::Missing:$missing. $hint"
          fi

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST || '187.127.84.93' }}
      SSH_USER: ${{ secrets.VPS_USER || vars.VPS_USER || 'root' }}
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
      STAGE: /srv/pookie-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: SSH credentials
        env:
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.PAWCAL_DEPLOY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            # trust-on-first-use; set VPS_HOST_KEY to pin the server's key instead
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
            [ -s ~/.ssh/known_hosts ] || { echo "::error::could not reach $HOST on port 22"; exit 1; }
          fi
          # The credential may be a private key or a password, and the secret it
          # arrives in may be named for another project. Decide by what it IS,
          # not by which name it came under. Only the verdict is ever printed.
          kind=none
          if [ -n "$KEY" ]; then
            if printf '%s' "$KEY" | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
              kind=key
            else
              kind=password
              SSHPASS="$KEY"
            fi
          elif [ -n "$SSHPASS" ]; then
            kind=password
          fi
          echo "credential looks like: $kind"
          case "$kind" in
            key)
              printf '%s\n' "$KEY" > ~/.ssh/id_deploy
              chmod 600 ~/.ssh/id_deploy
              ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1 \
                || { echo "::error::the credential begins like a private key but OpenSSH cannot read it. If it is passphrase-protected, or is a GitHub deploy key rather than a server login key, it cannot be used here."; exit 1; }
              echo "SSH=ssh -i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes" >> "$GITHUB_ENV"
              ;;
            password)
              sudo apt-get update -qq >/dev/null
              sudo apt-get install -y -qq sshpass >/dev/null
              echo "SSHPASS=$SSHPASS" >> "$GITHUB_ENV"
              echo "SSH=sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no" >> "$GITHUB_ENV"
              ;;
            *) echo "::error::no usable credential"; exit 1 ;;
          esac

      # A named step, so a wrong or foreign credential fails HERE with a clear
      # message rather than halfway through an rsync.
      - name: Can we log in?
        run: |
          if ! $SSH -o ConnectTimeout=20 "$SSH_USER@$HOST" 'echo ok; hostname; uname -sr'; then
            echo "::error title=SSH login failed::Could not log in to $SSH_USER@$HOST. The credential in the repository secret is not accepted by that server — check it is a login key or password for the VPS itself, not a GitHub deploy key or a credential for a different host."
            exit 1
          fi

      - name: Ship the build
        run: |
          $SSH "$SSH_USER@$HOST" "mkdir -p $STAGE"
          rsync -az --delete -e "$SSH" dist deploy "$SSH_USER@$HOST:$STAGE/"

      - name: Install on the server
        run: $SSH "$SSH_USER@$HOST" "bash $STAGE/deploy/remote.sh"

      - name: Smoke test
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H 'Host: pookie.nileapps.co.uk' "http://$HOST/" || echo 000)
          echo "http://$HOST/ (Host: pookie.nileapps.co.uk) -> $code"
          case "$code" in
            200|301|302) ;;
            *) echo "::error::unexpected status $code from the server"; exit 1 ;;
          esac
          tls=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://pookie.nileapps.co.uk/ || echo 000)
          echo "https://pookie.nileapps.co.uk/ -> $tls"
          {
            echo "### Deployed \`${GITHUB_SHA::7}\` to $HOST"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| http://$HOST/ with Host header | $code |"
            echo "| https://pookie.nileapps.co.uk/ | $tls |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$tls" = 200 ] || echo "::warning::https is not answering 200 yet — see the certificate notes in deploy/remote.sh"
